[package]
name = "real-estate-crm"
version = "3.2.1"
description = "Автономная CRM"
edition = "2021"
rust-version = "1.90"
[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-dialog = "=2.8.4"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Credentials"] }
