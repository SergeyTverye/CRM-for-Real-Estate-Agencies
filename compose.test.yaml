# Изолированная PostgreSQL для разработки и автоматических тестов (unit/integration/e2e).
# Не используется в production. Данные живут в tmpfs и пропадают при остановке.
#   docker compose -f compose.test.yaml up -d --wait
name: crm-test
services:
  testdb:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_test_password
      POSTGRES_DB: crm_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql:rw,size=512m
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm_test"]
      interval: 2s
      timeout: 3s
      retries: 30
