name: Desktop Windows
on:
  push:
    branches: [main, feature/desktop-v3.2, codex/desktop-installer-fix, feature/ux-search-v3.2.2]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'prisma/**'
      - 'public/**'
      - 'import-profiles/**'
      - 'vendor/**'
      - 'scripts/desktop/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '*config.*'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CRM_DEPLOYMENT_MODE: desktop
      DATABASE_URL: file:C:/crm-build-only/unused.db
      SQLITE_DATABASE_URL: file:C:/crm-build-only/unused.db
      DEPLOYMENT_ID: 00000000-0000-4000-8000-000000000032
      INSTANCE_ID: ci-build
      APP_TIMEZONE: Asia/Novosibirsk
    steps:
      - name: Preserve LF before checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: node scripts/desktop/check-config.mjs
      - name: Confidential paths and names (CI has no private fingerprints)
        run: node scripts/security/confidential-guard.mjs
      - name: Generate separate PG and SQLite clients
        run: |
          npm run prisma:generate
          npm run desktop:generate
      - name: Verify tracked runtime entrypoints and esbuild bundles
        run: node scripts/desktop/check-runtime-entries.mjs
      - name: Bundled runtime load and synthetic SQLite initialization
        run: node scripts/desktop/check-worker-bundles.mjs
      - name: Supervisor backup restart and in-flight shutdown
        run: node scripts/desktop/test-supervisor.mjs
      - name: Chromium for PDF, component and interactive-session tests
        run: npx playwright install chromium
      - name: Unit regression
        run: npx vitest run --project unit
      - name: SQLite integration regression
        run: npx vitest run --project integration-sqlite
      - name: Desktop bundle and artifact guard
        run: npm run desktop:bundle
      - name: Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - run: rustup override set 1.90.0
      - name: Reuse Rust dependencies and compilation
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/release/.fingerprint
            src-tauri/target/release/build
            src-tauri/target/release/deps
            src-tauri/target/release/incremental
          key: ${{ runner.os }}-rust-1.90-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-${{ hashFiles('src-tauri/src/**', 'src-tauri/build.rs') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.90-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-
      - name: Windows launcher regression
        shell: pwsh
        run: |
          $savedModules = $env:PSModulePath
          try {
            Remove-Item Env:\PSModulePath -ErrorAction SilentlyContinue
            powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/desktop/test-upgrade-resource-cleanup.ps1
            if ($LASTEXITCODE -ne 0) { throw 'UPGRADE_RESOURCE_TEST_FAILED' }
          } finally { $env:PSModulePath = $savedModules }
          ./scripts/desktop/test-native-node-path.ps1 -Node (Resolve-Path src-tauri/resources/app/node/node.exe).Path
          cargo test --manifest-path src-tauri/Cargo.toml --release --locked
      - name: Build NSIS offline installer
        run: npm run desktop:tauri
      - name: SHA-256, SBOM, runtime versions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path desktop-dist -Force | Out-Null
          $setup = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($setup.Count -ne 1) { throw 'EXPECTED_ONE_INSTALLER' }
          Copy-Item -LiteralPath $setup[0].FullName -Destination desktop-dist/CRM-Setup-Windows-x64.exe
          $sha=(Get-FileHash desktop-dist/CRM-Setup-Windows-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content desktop-dist/CRM-Setup-Windows-x64.exe.sha256 "$sha  CRM-Setup-Windows-x64.exe"
          Copy-Item src-tauri/resources/app/sbom.cdx.json,src-tauri/resources/app/RUNTIMES.md,scripts/desktop/test-installer.ps1 desktop-dist
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 | Out-File desktop-dist/rust-components.json -Encoding utf8
          Copy-Item src-tauri/Cargo.lock desktop-dist/Cargo.lock
          Copy-Item src-tauri/resources/app/desktop-manifest.json desktop-dist/desktop-manifest.json
          @{installerBytes=$setup[0].Length; commit="${{ github.sha }}"; node=(node --version); os=(Get-CimInstance Win32_OperatingSystem).Caption} | ConvertTo-Json | Set-Content desktop-dist/build-measurements.json
      - uses: actions/upload-artifact@v4
        with:
          name: CRM-Windows-x64
          path: desktop-dist/
          if-no-files-found: error
          retention-days: 14
      - name: Safe failure codes
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path desktop-evidence -Force | Out-Null
          Set-Content desktop-evidence/build.log 'BUILD_FAILED; inspect workflow step logs; no user data exported'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-diagnostic-codes
          path: desktop-evidence/
  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Deliberately no checkout, setup-node or build caches on the installation runner.
      - uses: actions/download-artifact@v4
        with:
          name: CRM-Windows-x64
          path: installer
      - name: Verify installer checksum
        shell: pwsh
        run: |
          $expected=(Get-Content installer/CRM-Setup-Windows-x64.exe.sha256).Split(' ')[0]
          if ((Get-FileHash installer/CRM-Setup-Windows-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'INSTALLER_CHECKSUM' }
      - name: Install, ready, create, uninstall, reinstall, purge
        shell: pwsh
        run: ./installer/test-installer.ps1 -Installer (Resolve-Path installer/CRM-Setup-Windows-x64.exe).Path
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-evidence-${{ matrix.os }}
          path: desktop-evidence/
          if-no-files-found: warn
